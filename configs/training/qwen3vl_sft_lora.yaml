# qwen3vl_sft_lora.yaml — ms-swift LoRA SFT config template
# Usage:  swift sft --config configs/training/qwen3vl_sft_lora.yaml
#
# Reference: docs/training/RUNBOOK.md §2.1 + docs/项目总执行计划.md §12
#
# ⚠️ 这是模板 — 实际跑前先:
#   1. swift sft --help 确认当前 ms-swift 版本支持的参数名
#   2. 改 model/dataset/output_dir 为你的实际路径
#   3. 按数据规模调 lora_rank / learning_rate / num_train_epochs

# ===== Model =====
model: Qwen/Qwen3-VL-2B-Instruct
torch_dtype: bfloat16
# attn_impl: flash_attn   # 可选：开 flash-attn 加速

# ===== Dataset (按 RUNBOOK §1.2 schema) =====
dataset: training/data/sft/train.jsonl
val_dataset: training/data/sft/val.jsonl

# ===== Output =====
output_dir: training/outputs/sft
# save_steps: 500
# logging_steps: 10
# save_total_limit: 3   # 只保留最近 3 个 ckpt + best

# ===== LoRA tuner =====
tuner_type: lora
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
target_modules: all-linear

# ===== Freeze vision tower + aligner (per §12 recommended first version) =====
freeze_vit: true
freeze_aligner: true

# ===== Training hyperparams =====
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8     # effective batch = 1 * 8 * world_size
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_length: 2048
gradient_checkpointing: true
bf16: true

# ===== Multimodal =====
# max_image_size: 1024       # 控制 image token 数
# video_fps: 1.0             # 视频采样 fps
# video_max_frames: 32       # 视频最大帧数

# ===== Logging =====
report_to: tensorboard            # tensorboard --logdir <output_dir>/runs
logging_steps: 10
# report_to: wandb               # 备选：W&B（需要 export WANDB_API_KEY）
